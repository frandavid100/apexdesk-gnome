[package]
name = "wordcraft-gnome"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "GPL-3.0-or-later"
publish = false
default-run = "wordcraft-gnome-smoke"
description = "Interfaz GTK4/libadwaita experimental para el motor independiente de WordCraft"

[features]
default = []
gui = ["dep:gtk", "dep:adw"]

[[bin]]
name = "wordcraft-gnome"
path = "src/bin/gnome.rs"
required-features = ["gui"]

[[bin]]
name = "wordcraft-gnome-smoke"
path = "src/main.rs"

[dependencies]
# Anclado a una revisión concreta para reproducir cada compilación.
wordcraft-doc = { git = "https://github.com/storytold/wordcraft", rev = "165d5725dc25b4a7887d8025c3b1fe506ccc3dcc" }
wordcraft-engine = { git = "https://github.com/storytold/wordcraft", rev = "165d5725dc25b4a7887d8025c3b1fe506ccc3dcc" }
wordcraft-render = { git = "https://github.com/storytold/wordcraft", rev = "165d5725dc25b4a7887d8025c3b1fe506ccc3dcc" }
serde_json = "1"
gtk = { package = "gtk4", version = "0.10", features = ["v4_10"], optional = true }
adw = { package = "libadwaita", version = "0.8", features = ["v1_4"], optional = true }

# WordCraft usa un backend PDF modificado. Los [patch] de una dependencia
# no se heredan: el proyecto consumidor debe declarar el mismo reemplazo.
[patch.crates-io]
krilla = { git = "https://github.com/storytold/craft-libs", rev = "92d392cff132eaf53e13afff77f38b5c11b73aa0" }

# Production binaries optimize the renderer and engine as well as the GTK host.
# Keep unwinding: upstream uses catch_unwind in file/recovery operations.
[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"

# Small, auditable compatibility patch; see patches/README.md.
[patch."https://github.com/storytold/wordcraft"]
wordcraft-formats = { path = "vendor/wordcraft-formats" }
