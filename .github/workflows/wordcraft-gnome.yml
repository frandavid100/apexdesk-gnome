name: "WordCraft GNOME — fase 3D guardado"
on:
  push:
    branches: [wordcraft-migration, wordcraft-viewer, adwaita-layout, wordcraft-selection, wordcraft-editing, wordcraft-formatting, wordcraft-saving]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar bibliotecas GNOME y pantalla virtual
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config libgtk-4-dev libadwaita-1-dev xvfb xauth scrot xdotool adwaita-icon-theme poppler-utils
      - name: Tests sin interfaz
        run: cargo test
      - name: Validar árbol sin egui/eframe
        run: |
          cargo tree --features gui --edges normal --prefix none --format '{p}' | tee dependencies.txt
          if grep -E '^(egui|eframe|egui-[a-z0-9_-]+|epaint) v' dependencies.txt; then
            echo 'ERROR: dependencia egui encontrada'
            exit 1
          fi
      - name: Compilar lector GNOME
        run: cargo build --release --locked --features gui --bin wordcraft-gnome
      - name: Vista del motor sin interfaz
        run: |
          cargo run -- --png muestra-wordcraft.png
          test -s muestra-wordcraft.png
      - name: Comparar rendimiento reproducible
        run: |
          cargo run --locked --example performance > performance-debug.txt
          cargo run --release --locked --example performance > performance-release.txt
          cat performance-debug.txt performance-release.txt
          diff <(grep '^CHECK' performance-debug.txt) <(grep '^CHECK' performance-release.txt)
      - name: Identificar versión de prueba
        run: |
          ./target/release/wordcraft-gnome --version | tee version.txt
          grep -q "fase 3D" version.txt
      - name: Probar escritorio ancho, ventana estrecha, panel y tema oscuro
        run: |
          python -m pip install --disable-pip-version-check pillow==11.3.0
          xvfb-run -a -s "-screen 0 1280x900x24" bash -c '
            set -e
            run_case () {
              output="$1"
              shift
              GSK_RENDERER=cairo ./target/release/wordcraft-gnome --test-document "$@" \
                > "out-${output}.log" 2> "err-${output}.log" &
              pid=$!
              sleep 7
              if ! kill -0 "$pid" 2>/dev/null; then
                cat "err-${output}.log"
                exit 1
              fi
              scrot "$output"
              kill "$pid"
              wait "$pid" || true
            }
            GSK_RENDERER=cairo ./target/release/wordcraft-gnome --test-document --view-pointer-test 2> view-pointer.log &
            view_pid=$!
            for attempt in $(seq 1 300); do
              if grep -q VIEW_POINTER_READY view-pointer.log; then break; fi
              kill -0 "$view_pid"
              sleep 0.1
            done
            grep -q VIEW_POINTER_READY view-pointer.log
            read marker mx my tx ty < <(grep VIEW_POINTER_READY view-pointer.log | tail -n1)
            view_window=$(xdotool search --onlyvisible --pid "$view_pid" | head -n1)
            xdotool windowfocus --sync "$view_window"
            xdotool mousemove --window "$view_window" "$mx" "$my" click 1
            sleep 0.3
            xdotool mousemove --window "$view_window" "$tx" "$ty" click 1
            for attempt in $(seq 1 100); do
              if grep -q VIEW_POINTER_DISMISSED view-pointer.log; then break; fi
              kill -0 "$view_pid"
              sleep 0.1
            done
            grep -q VIEW_POINTER_DISMISSED view-pointer.log
            xdotool mousemove --window "$view_window" "$tx" "$ty" click 1
            wait "$view_pid" || { scrot view-pointer-failure.png; cat view-pointer.log; exit 1; }
            grep -q VIEW_POINTER_OK view-pointer.log
            GSK_RENDERER=cairo ./target/release/wordcraft-gnome --table-keyboard-test 2> table-keyboard.log &
            table_pid=$!
            for attempt in $(seq 1 300); do
              if grep -q TABLE_KEYBOARD_READY table-keyboard.log; then break; fi
              kill -0 "$table_pid"
              sleep 0.1
            done
            grep -q TABLE_KEYBOARD_READY table-keyboard.log
            table_window=$(xdotool search --onlyvisible --pid "$table_pid" | head -n1)
            xdotool windowfocus --sync "$table_window"
            xdotool key Tab Tab
            xdotool type --clearmodifiers --delay 40 GNOME
            xdotool key shift+Tab
            wait "$table_pid"
            grep -q TABLE_KEYBOARD_OK table-keyboard.log
            GSK_RENDERER=cairo ./target/release/wordcraft-gnome --test-document --motion-ui-test 2> motion-ui.log
            grep -q MOTION_UI_OK motion-ui.log
            run_case vista-insertar-tabla.png --table-insert-demo
            run_case vista-menu-tabla.png --table-menu-demo
            run_case vista-propiedades-tabla.png --table-properties-demo
            run_case vista-texto-avanzado.png --advanced-text-demo
            run_case vista-parrafo-avanzado.png --advanced-paragraph-demo
            GSK_RENDERER=cairo ./target/release/wordcraft-gnome --styles-ui-test 2> styles-popover.log
            grep -q STYLES_POPOVER_OK styles-popover.log
            run_case vista-estilos.png --styles-demo
            run_case vista-estilos-fijado.png --styles-demo --pin-demo
            run_case vista-estilo-detalle.png --style-details-demo
            run_case vista-estilo-nuevo.png --style-new-demo
            run_case vista-estilos-estrecha.png --styles-demo --narrow
            run_case vista-preferencias.png --preferences-demo
            GSK_RENDERER=cairo ./target/release/wordcraft-gnome --test-document --search-ui-test 2> search-sidebar.log
            grep -q SEARCH_SIDEBAR_OK search-sidebar.log
            GSK_RENDERER=cairo ./target/release/wordcraft-gnome --test-document --paragraph-ui-test 2> paragraph-popover.log
            grep -q PARAGRAPH_POPOVER_OK paragraph-popover.log
            GSK_RENDERER=cairo ./target/release/wordcraft-gnome --test-document --split-states-demo 2> split-states.log &
            split_pid=$!
            for attempt in $(seq 1 300); do
              if grep -q SPLIT_POINTER_READY split-states.log; then break; fi
              kill -0 "$split_pid"
              sleep 0.1
            done
            read marker bx by ax ay < <(grep SPLIT_POINTER_READY split-states.log | tail -n1)
            split_window=$(xdotool search --onlyvisible --pid "$split_pid" | head -n1)
            xdotool mousemove --window "$split_window" 600 150
            sleep 0.4
            scrot vista-dividido-reposo.png
            xdotool mousemove --window "$split_window" "$bx" "$by"
            sleep 0.4
            scrot vista-dividido-cuerpo.png
            xdotool mousemove --window "$split_window" "$ax" "$ay"
            sleep 0.4
            scrot vista-dividido-flecha.png
            xdotool click 1
            sleep 0.4
            grep -q SPLIT_SUBPAGE_OK split-states.log
            scrot vista-dividido-subpagina.png
            kill "$split_pid"
            wait "$split_pid" || true
            GSK_RENDERER=cairo ./target/release/wordcraft-gnome --document-tools-test 2> document-tools.log &
            tools_pid=$!
            for attempt in $(seq 1 300); do
              if grep -q IMAGE_POINTER_READY document-tools.log; then break; fi
              kill -0 "$tools_pid"
              sleep 0.1
            done
            read marker ix iy < <(grep IMAGE_POINTER_READY document-tools.log | tail -n1)
            tools_window=$(xdotool search --onlyvisible --pid "$tools_pid" | head -n1)
            xdotool windowfocus --sync "$tools_window"
            xdotool mousemove --window "$tools_window" "$ix" "$iy" click 1
            wait "$tools_pid" || { cat document-tools.log; exit 1; }
            grep -q DOCUMENT_TOOLS_OK document-tools.log
            pdftoppm -scale-to 1200 -png -singlefile document-tools-test.pdf vista-pdf-exportado
            pdfinfo document-tools-test.pdf
            run_case vista-imagen.png --picture-demo
            run_case vista-imagen-estrecha.png --picture-demo --narrow
            run_case vista-propiedades-documento.png --document-properties-demo
            run_case vista-parrafo.png --paragraph-demo
            run_case vista-interlineado.png --paragraph-spacing-demo
            run_case vista-parrafo-estrecha.png --paragraph-demo --narrow
            run_case vista-parrafo-oscura.png --paragraph-demo --dark
            run_case vista-buscar-estrecha.png --search-demo --narrow
            GSK_RENDERER=cairo ./target/release/wordcraft-gnome --test-document --nav-ui-test 2> sidebar-navigation.log
            grep -q SIDEBAR_NAVIGATION_OK sidebar-navigation.log
            GSK_RENDERER=cairo ./target/release/wordcraft-gnome --chrome-ui-test 2> document-chrome.log
            grep -q DOCUMENT_CHROME_OK document-chrome.log
            GSK_RENDERER=cairo ./target/release/wordcraft-gnome --test-document --pin-ui-test 2> popover-pin.log
            grep -q POPOVER_PIN_OK popover-pin.log
            run_case vista-titulos.png --outline-demo
            run_case vista-menu-principal.png --main-menu-demo
            run_case vista-menu-documento.png --document-menu-demo
            run_case vista-todas-pestanas.png --overview-demo
            run_case vista-buscar.png --search-demo
            GSK_RENDERER=cairo ./target/release/wordcraft-gnome --tabs-test 2> tabs.log
            grep -q TABS_OK tabs.log
            run_case vista-texto.png --text-menu-demo
            run_case vista-zoom.png --zoom-menu-demo
            GSK_RENDERER=cairo ./target/release/wordcraft-gnome --multiwindow-test 2> multiwindow.log
            grep -q MULTIWINDOW_OK multiwindow.log
            run_case vista-gnome.png --sidebar
            run_case vista-seleccion.png --sidebar --select-demo
            run_case vista-edicion.png --sidebar --edit-demo
            run_case vista-formato.png --sidebar --format-demo
            run_case vista-sin-panel.png
            run_case vista-estrecha-panel.png --narrow --sidebar
            run_case vista-estrecha.png --narrow
            run_case vista-oscura.png --dark --sidebar
            GSK_RENDERER=cairo ./target/release/wordcraft-gnome --test-document >gui-out.log 2>gui-err.log &
            pid=$!
            sleep 2
            GSK_RENDERER=cairo ./target/release/wordcraft-gnome --test-document >gui2-out.log 2>gui2-err.log &
            pid2=$!
            sleep 2
            kill -0 "$pid"
            kill -0 "$pid2"
            kill "$pid2" "$pid"
            wait "$pid2" || true
            wait "$pid" || true
          '
          python - <<'PY'
          from PIL import Image
          images = ["vista-gnome.png", "vista-seleccion.png", "vista-edicion.png", "vista-formato.png", "vista-sin-panel.png",
                    "vista-estrecha-panel.png", "vista-estrecha.png",
                    "vista-oscura.png"]
          images += ["vista-texto.png", "vista-zoom.png"]
          for name in images:
              image = Image.open(name).convert("RGB")
              region = image.crop((0, 0, 300, 85))
              if all(pixel == (0, 0, 0) for pixel in region.getdata()):
                  raise SystemExit(f"CAPTURA VACÍA: {name}")
              print(f"OK: {name}, ventana renderizada")
          PY
      - name: Capturar vista doble al 100 por ciento
        run: |
          xvfb-run -a -s "-screen 0 1920x1080x24" bash -c '
            set -e
            GSK_RENDERER=cairo ./target/release/wordcraft-gnome --test-document --spreads-demo > spread-out.log 2> spread-err.log &
            pid=$!
            sleep 7
            kill -0 "$pid"
            scrot vista-paginas-dobles.png
            kill "$pid"
            wait "$pid" || true
          '
      - name: Preparar ejecutable ligero sin símbolos de depuración
        run: |
          cp target/release/wordcraft-gnome wordcraft-gnome
          echo "Antes de strip:"
          ls -lh wordcraft-gnome
          strip --strip-unneeded wordcraft-gnome
          echo "Después de strip:"
          ls -lh wordcraft-gnome
          test -s wordcraft-gnome
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wordcraft-gnome-fase3d-linux
          path: |
            wordcraft-gnome
            muestra-wordcraft.png
            vista-gnome.png
            vista-texto.png
            vista-zoom.png
            multiwindow.log
            tabs.log
            table-keyboard.log
            vista-preferencias.png
            vista-insertar-tabla.png
            vista-menu-tabla.png
            vista-propiedades-tabla.png
            vista-texto-avanzado.png
            vista-parrafo-avanzado.png
            vista-estilos.png
            vista-estilos-fijado.png
            vista-estilo-detalle.png
            vista-estilo-nuevo.png
            vista-estilos-estrecha.png
            styles-popover.log
            motion-ui.log
            vista-buscar.png
            vista-buscar-estrecha.png
            vista-parrafo.png
            vista-interlineado.png
            vista-parrafo-estrecha.png
            vista-parrafo-oscura.png
            search-sidebar.log
            paragraph-popover.log
            document-tools.log
            document-tools-test.pdf
            vista-pdf-exportado.png
            vista-imagen.png
            vista-imagen-estrecha.png
            vista-propiedades-documento.png
            split-states.log
            vista-dividido-reposo.png
            vista-dividido-cuerpo.png
            vista-dividido-flecha.png
            vista-dividido-subpagina.png
            view-pointer.log
            sidebar-navigation.log
            document-chrome.log
            popover-pin.log
            vista-titulos.png
            vista-menu-principal.png
            vista-menu-documento.png
            vista-todas-pestanas.png
            view-pointer-failure.png
            vista-paginas-dobles.png
            vista-seleccion.png
            vista-edicion.png
            vista-formato.png
            vista-sin-panel.png
            vista-estrecha-panel.png
            vista-estrecha.png
            vista-oscura.png
            gui-err.log
            dependencies.txt
            Cargo.lock
            version.txt
            performance-debug.txt
            performance-release.txt
          if-no-files-found: warn



