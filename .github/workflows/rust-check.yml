name: "Fase 1 - motores ApexDesk sin GUI"
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Obtener el proyecto
        uses: actions/checkout@v4

      - name: Instalar Rust estable
        uses: dtolnay/rust-toolchain@stable

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Crear archivos externos independientes
        run: |
          python -m pip install --disable-pip-version-check python-docx==1.2.0 odfpy==1.4.1
          python scripts/make_fixtures.py
          python scripts/verify_fixtures.py

      - name: Resolver versiones y compilar
        run: |
          cargo generate-lockfile
          cargo test --locked

      - name: Comprobar que no incluye egui
        run: bash scripts/check-dependencies.sh

      - name: Probar edición y reapertura de DOCX y ODT
        run: |
          cargo run --locked -- smoke target/phase1-smoke
          cargo run --locked -- edit-copy fixtures/externo.docx target/phase1-smoke/externo-editado.docx ejemplo prueba
          cargo run --locked -- edit-copy fixtures/externo.odt target/phase1-smoke/externo-editado.odt ejemplo prueba

      - name: Guardar artefactos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fase1-resultados
          path: |
            Cargo.lock
            target/phase1-smoke/
          if-no-files-found: warn
