name: "Fase 2 - GNOME GTK4 libadwaita"
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux-gnome:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Instalar dependencias de GNOME
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config libgtk-4-dev libadwaita-1-dev

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Generar documentos externos
        run: |
          python -m pip install --disable-pip-version-check python-docx==1.2.0 odfpy==1.4.1
          python scripts/make_fixtures.py
          python scripts/verify_fixtures.py

      - name: Probar modelo de lectura y motor
        run: cargo test

      - name: Compilar aplicación GNOME
        run: cargo build --features gui --bin apexdesk-gnome

      - name: Comprobar dependencias sin egui
        run: bash scripts/check-dependencies.sh --features gui

      - name: Publicar prototipo Linux (depende de GTK/libadwaita del sistema)
        uses: actions/upload-artifact@v4
        with:
          name: apexdesk-gnome-fase2-ubuntu2404
          path: target/debug/apexdesk-gnome
          if-no-files-found: error
